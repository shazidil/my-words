<style>
/* Layout: one phone-width column. Home is a shelf of book covers with a daily goal; tab bar floats at the bottom. */
:root{
  --bg:#E4D6C8;--panel:#F6F0E8;--card:#FCF9F4;--ink:#3A3050;--muted:#675B72;--line:#E3D8CB;
  --accent:#6F58B5;--on-accent:#FFFFFF;--coral:#C94A32;--field:#FFFFFF;
  --lilac:#E7DFF6;--lilac-ink:#4A3A86;--mint:#DCEFE3;--mint-ink:#2D5E45;
  --peach:#FADFD3;--peach-ink:#82381F;--sky:#DDE9F5;--sky-ink:#2E5379;
  --grad:linear-gradient(90deg,#6F58B5,#C94A32);--on-grad:#FFFFFF;
  --hero:linear-gradient(135deg,#E3DAF5,#F8DDD0);
  --shadow:0 6px 18px rgba(80,55,40,.14);
  --wall:linear-gradient(180deg,#EFE6F7,#F6E7E0);--plank:#C99A6B;--plank-hi:#E0B88C;--glow:rgba(255,255,255,0);
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Lora',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121D;--panel:#201B29;--card:#2A2435;--ink:#F2EBF8;--muted:#BDB2CB;--line:#3A3347;
    --accent:#B3A2F0;--on-accent:#21173F;--coral:#F08A6E;--field:#322B3F;
    --lilac:#373050;--lilac-ink:#DCD2FB;--mint:#223A2E;--mint-ink:#BCE6CC;
    --peach:#47291F;--peach-ink:#FAC9B3;--sky:#21364B;--sky-ink:#C0DBF2;
    --grad:linear-gradient(90deg,#9B86E6,#EE8467);--on-grad:#1E1432;--hero:linear-gradient(135deg,#352D52,#4A2E2B);
    --shadow:0 6px 18px rgba(0,0,0,.4);color-scheme:dark;
    --wall:linear-gradient(180deg,#2A2340,#241F33);--plank:#6B4E3A;--plank-hi:#8A6A52;
  }
}
:root[data-theme="dark"]{
  --bg:#16121D;--panel:#201B29;--card:#2A2435;--ink:#F2EBF8;--muted:#BDB2CB;--line:#3A3347;
  --accent:#B3A2F0;--on-accent:#21173F;--coral:#F08A6E;--field:#322B3F;
  --lilac:#373050;--lilac-ink:#DCD2FB;--mint:#223A2E;--mint-ink:#BCE6CC;
  --peach:#47291F;--peach-ink:#FAC9B3;--sky:#21364B;--sky-ink:#C0DBF2;
  --grad:linear-gradient(90deg,#9B86E6,#EE8467);--on-grad:#1E1432;--hero:linear-gradient(135deg,#352D52,#4A2E2B);
  --shadow:0 6px 18px rgba(0,0,0,.4);color-scheme:dark;
  --wall:linear-gradient(180deg,#2A2340,#241F33);--plank:#6B4E3A;--plank-hi:#8A6A52;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--panel);position:relative}
#view{flex:1;overflow-y:auto;padding:22px 16px 20px;display:flex;flex-direction:column;gap:16px}
#view>*{flex-shrink:0}
.shelf{scrollbar-width:none;scroll-padding-left:16px}.shelf::-webkit-scrollbar{display:none}
h1{margin:0;font-size:26px;font-weight:800;text-wrap:balance;line-height:1.15}
h2{margin:0;font-size:18px;font-weight:800}
.sub{margin:0;color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.hello{font-size:14px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.tint-lilac{background:var(--lilac)}.tint-mint{background:var(--mint)}.tint-peach{background:var(--peach)}.tint-sky{background:var(--sky)}
label,.cap{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}
input,textarea,select{width:100%;border:2px solid transparent;border-radius:16px;background:var(--field);color:var(--ink);font:600 16px var(--sans);padding:12px 16px}
input{height:48px;padding-top:0;padding-bottom:0}
select{height:48px;padding-top:0;padding-bottom:0}
textarea{resize:none}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:48px;border:0;border-radius:24px;background:var(--grad);color:var(--on-grad);font:800 16px var(--sans);padding:0 22px;cursor:pointer;box-shadow:0 4px 12px rgba(111,88,181,.35)}
.btn:disabled{opacity:.6}
.btn.soft{background:var(--lilac);color:var(--lilac-ink);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line)}
.pill{display:inline-block;border-radius:14px;padding:6px 12px;font-size:15px;font-weight:700;background:var(--field);color:var(--ink)}
.tag{border-radius:12px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.t-New{background:var(--lilac);color:var(--lilac-ink)}.t-Learning{background:var(--peach);color:var(--peach-ink)}.t-Learned{background:var(--mint);color:var(--mint-ink)}
.speak{width:48px;height:48px;flex:none;border:0;border-radius:24px;background:var(--field);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.word{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.pos{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:18px;padding:10px 16px;min-height:44px;font:800 14px var(--sans);background:var(--card);color:var(--muted);cursor:pointer;box-shadow:0 2px 6px rgba(80,55,40,.1)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.bar{height:10px;border-radius:5px;background:var(--lilac)}
.bar>div{height:100%;border-radius:5px;background:var(--grad);transition:width .3s}
.back{background:none;border:0;color:var(--muted);font:800 15px var(--sans);display:flex;align-items:center;gap:6px;min-height:44px;padding:0;cursor:pointer;align-self:flex-start}
.note{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:var(--peach-ink);background:var(--peach);border-radius:14px;padding:10px 14px}
/* home */
.streak{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:8px 14px;box-shadow:var(--shadow);font-weight:800;font-size:15px}
.feat{position:relative;overflow:hidden;background:var(--feat);color:var(--feat-ink);border-radius:28px;padding:18px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);min-height:170px}
.feat .ft{flex:1;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.feat .tag{align-self:flex-start;font-size:12px;font-weight:800;border:1px solid currentColor;border-radius:99px;padding:3px 10px}
.feat h2{color:var(--feat-ink);font-size:26px;line-height:1.1;margin:0}.feat p{font-size:14px;opacity:.9;margin:0}
.feat .btn{align-self:flex-start;background:var(--card);color:var(--accent);min-height:42px;padding:0 16px}
.feat svg.bk{width:46%;max-width:190px;flex-shrink:0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.feat .petal{position:absolute;width:14px;height:14px;border-radius:14px 0 14px 0;background:#F4A6B8;opacity:.8;animation:fall 7s linear infinite}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(220px) rotate(300deg)}}
.goalbar{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);color:var(--ink);border-radius:20px;padding:12px 14px;font:inherit;cursor:pointer;box-shadow:var(--shadow)}.goalbar .gb{width:46px;height:46px;border-radius:50%;background:var(--lilac);color:var(--lilac-ink);display:flex;align-items:center;justify-content:center;font-weight:800}.goalbar .go{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:8px 14px;font-weight:800}
:root[data-skin="lavender"] #view,:root[data-skin="mint"] #view,:root[data-skin="peach"] #view,:root[data-skin="blossom"] #view,:root[data-skin="maple"] #view,:root[data-skin="ocean"] #view{background-image:radial-gradient(circle at 12% 6%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle at 88% 22%,rgba(255,255,255,.9) 0 3px,transparent 4px),radial-gradient(circle at 30% 60%,rgba(255,255,255,.8) 0 2px,transparent 3px)}
.tprev{pointer-events:none;zoom:.72;border-radius:20px;overflow:hidden}.tprev button{pointer-events:none}
.deco{height:0;position:relative;pointer-events:none}.deco svg{position:absolute;right:-6px;top:-22px;width:150px;opacity:.95;z-index:0}.deco~.row .streak{position:relative;z-index:1}.deco+.row{margin-top:40px}
:root[data-skin="midnight"] #view{background-image:radial-gradient(circle at 15% 10%,rgba(255,190,90,.16) 0 3px,transparent 4px),radial-gradient(circle at 80% 30%,rgba(255,190,90,.14) 0 2px,transparent 3px),radial-gradient(circle at 40% 70%,rgba(255,190,90,.12) 0 3px,transparent 4px)}
@media(prefers-reduced-motion:reduce){.feat .petal{animation:none}}
.hero{background:var(--hero);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

  var q=S.q.trim().toLowerCase(),out='';
  var arr=S.words.slice().sort(function(a,b){return b.added-a.added;}).filter(function(w){
    return (S.filter==='All'||status(w)===S.filter)&&(S.bookF==='All books'||(w.bookTitle||'')===S.bookF)&&(!q||w.word.toLowerCase().indexOf(q)>-1||w.meaning.toLowerCase().indexOf(q)>-1);
  });
  if(!arr.length)return '<div class="card note">'+(S.words.length?'No words match.':'No words yet. Add the first word you do not know.')+'</div>';
  arr.forEach(function(w){
    var st=status(w);
    out+='<button class="item" style="--c:'+colorFor(w.bookTitle)+'" data-act="open" data-id="'+w.id+'"><span class="rib r-'+st+'" aria-hidden="true"></span>'+(coverUrl(w.bookTitle)?'<img class="cimg thumb" src="'+esc(coverUrl(w.bookTitle))+'" alt="">':'')+'<span style="flex:1;min-width:0"><span class="w">'+esc(w.word)+'</span><span class="s">'+esc(w.ipa||'')+'</span><br><span class="m">'+esc(w.meaning)+'</span>'+(w.bookTitle?'<br><span class="bk">'+esc(w.bookTitle)+'</span>':'')+'<span style="position:absolute;left:-9999px">'+st+'</span></span></button>';
  });
  return out;
}
function vWords(){
  var h='<div class="row between"><h1>My words</h1><span class="sub">'+S.words.length+' saved</span></div>'+
   '<label for="q" style="position:absolute;left:-9999px">Search words</label><input id="q" data-in="q" placeholder="Search a word" value="'+esc(S.q)+'">'+
   (bookTitles().length?'<label for="bk" style="position:absolute;left:-9999px">Filter by book</label><select id="bk" data-in="bk"><option>All books</option>'+bookTitles().map(function(b){return '<option'+(S.bookF===b?' selected':'')+'>'+esc(b)+'</option>';}).join('')+'</select>':'')+
   '<div class="chips">';
  ['All','New','Learning','Learned'].forEach(function(f){h+='<button class="chip" data-act="filter" data-f="'+f+'" aria-pressed="'+(S.filter===f)+'">'+f+'</button>';});
  return h+'</div><div id="list" style="display:flex;flex-direction:column;gap:12px">'+listHtml()+'</div>';
}
function vDetail(w){
  var st=status(w),h='<button class="back" data-act="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>My words</button>';
  h+='<div class="card tint-mint"><div class="row between"><div><div class="word">'+esc(w.word)+'</div><div class="pos">'+esc(w.pos)+'</div></div>'+spk(w.word)+'</div>'+
     '<div class="chips">'+(w.ipa?'<span class="pill">'+esc(w.ipa)+'</span>':'')+'<span class="tag t-'+st+'" style="align-self:center">'+st+'</span></div>'+
     '<p style="margin:0;font-size:17px;font-weight:800">'+esc(w.meaning)+'</p>'+(w.example?'<p style="margin:0;font-family:var(--serif);font-style:italic">'+esc(w.example)+'</p>':'')+'</div>';
  if(w.bookTitle)h+='<div class="card tint-sky"><div class="cap" style="color:var(--sky-ink)">Wrong book cover?</div><label for="bka">Author</label><input id="bka" value="'+esc((S.info[w.bookTitle]||{}).ua||(S.info[w.bookTitle]||{}).a||'')+'" placeholder="e.g. Freida McFadden" autocomplete="off"><div class="row"><button class="btn" data-act="refind" data-b="'+esc(w.bookTitle)+'" style="flex:1">Find cover</button><button class="btn ghost" data-act="nextcover" data-b="'+esc(w.bookTitle)+'" style="flex:1">Try another</button></div></div>';
  if(w.book||w.bookTitle)h+='<div class="card"><div class="cap">In your book</div><div class="row" style="align-items:flex-start">'+(coverUrl(w.bookTitle)?'<img class="cimg thumb-lg" src="'+esc(coverUrl(w.bookTitle))+'" alt="Cover of '+esc(w.bookTitle)+'">':'')+'<div class="quote" style="flex:1">'+(w.book?esc(w.book):'')+(w.bookTitle?'<span class="by">'+esc(w.bookTitle)+(w.page?' · page '+esc(w.page):'')+'</span>':'')+'</div></div></div>';
  h+='<div class="card tint-lilac"><label for="ms">My own sentence</label><textarea id="ms" data-in="ms" rows="2" placeholder="Write a sentence using this word">'+esc(w.mine||'')+'</textarea><button class="btn" data-act="savemine">Save my sentence</button></div>';
  h+=S.confirmDel?'<div class="row"><button class="btn ghost" data-act="delno" style="flex:1">Keep it</button><button class="btn again" data-act="delyes" style="flex:1">Delete word</button></div>':'<button class="btn ghost" data-act="del">Delete this word</button>';
  return h;
}
function startPractice(all){
  var now=Date.now(),q=S.words.filter(function(w){return all||w.due<=now;}).sort(function(a,b){return a.due-b.due;}).slice(0,S.settings.session||10);
  S.pr={queue:q.map(function(w){return w.id;}),i:0,shown:false,total:q.length,sentence:'',finished:!q.length,started:true,good:0};
}
function vPractice(){
  var p=S.pr,h='';
  if(!S.words.length)return '<h1>Practice</h1><div class="card note">Save a few words first, then practice them here.</div><button class="btn" data-act="goadd">Add a word</button>';
  if(!p.started)startPractice(false);
  if(p.finished||p.i>=p.queue.length){
    var due=dueCount();
    h+='<h1>Practice</h1><div class="card tint-mint cheer"><div class="big">'+(p.total?'🎉':'📚')+'</div><h2>'+(p.total?'Well done!':'All caught up')+'</h2><p style="margin:0">'+(p.total?'You practiced '+p.total+' word'+(p.total>1?'s':'')+', and '+p.good+' felt easy. Come back tomorrow to keep your '+streakNow()+'-day streak.':'No words are due right now. Come back later, or practice everything again.')+'</p></div>';
    h+='<button class="btn" data-act="prall">Practice all words again</button>';
    if(due)h+='<button class="btn soft" data-act="prdue">Practice due words</button>';
    return h;
  }
  var w=byId(p.queue[p.i]);
  if(!w){p.i++;return vPractice();}
  h+='<div class="row between"><h1>Practice</h1><span class="sub">'+(p.i+1)+' of '+p.queue.length+'</span></div><div class="bar"><div style="width:'+Math.round(p.i/p.queue.length*100)+'%"></div></div>';
  var cz='';if(w.book){var re=new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');cz='<div class="quote" style="width:100%;text-align:left">'+esc(w.book).replace(re,'<b>____</b>')+(w.bookTitle?'<span class="by">'+esc(w.bookTitle)+(w.page?' · page '+esc(w.page):'')+'</span>':'')+'</div>';}
  if(!p.shown&&cz)h+='<div class="cap">Remember this line?</div>'+cz;
  h+='<div class="flash"><div class="word">'+esc(w.word)+'</div>'+(w.ipa?'<div class="pos">'+esc(w.ipa)+'</div>':'')+spk(w.word)+(w.bookTitle?'<div class="cap" style="color:var(--coral)">'+esc(w.bookTitle)+'</div>':'');
  if(p.shown)h+='<div style="width:100%;height:1px;background:var(--line)"></div><div style="font-size:19px;font-weight:800">'+esc(w.meaning)+'</div>'+(w.example?'<div style="font-family:var(--serif);font-style:italic">'+esc(w.example)+'</div>':'');
  h+='</div>';
  if(p.shown)h+='<div class="card tint-lilac"><label for="pm">Use it in your own sentence</label><textarea id="pm" data-in="pm" rows="2" placeholder="Write a sentence. It helps the word stick.">'+esc(w.mine||'')+'</textarea></div>';
  if(!p.shown)h+='<button class="btn" data-act="show" style="min-height:56px">Show meaning</button>';
  else h+='<div class="grade"><button class="btn again" data-act="again">Again</button><button class="btn got" data-act="got">Got it</button></div>';
  return h;
}
function render(){
  var v=$('#view'),h;
  if(S.tab==='home')h=vHome();
  else if(S.tab==='add')h=vAdd();
  else if(S.tab==='words'){var w=S.open?byId(S.open):null;h=w?vDetail(w):vWords();}
  else if(S.tab==='settings')h=vSettings();
  else h=vPractice();
  v.innerHTML=h;
  var due=dueCount(),tabs=[['home','Home'],['words','Words'],['add','Add'],['practice','Practice'],['settings','Settings']],n='';
  tabs.forEach(function(t){var cur=S.tab===t[0]?' aria-current="page"':'';
    n+='<button'+(t[0]==='add'?' class="fab" aria-label="Add a word"':'')+' data-act="tab" data-t="'+t[0]+'"'+cur+'>'+ICO[t[0]]+(t[0]==='add'?'':t[1])+(t[0]==='practice'&&due?'<span class="dot">'+due+'</span>':'')+'</button>';});
  $('#nav').innerHTML=n;
  bookTitles().forEach(ensureInfo);
  if(S.tab==='add'){updateCovPrev();if(!S._fo){S._fo=1;setTimeout(function(){var e=$('#aw');if(e&&!S.add.word)e.focus();},60);}}else S._fo=0;
  renderOverlay();
}

function saveWord(){

    var r=S.add.res;if(!r)return;
    if(!r.meaning.trim()){S.add.err='Add the meaning first.';render();return;}
    var now=Date.now();
    S.words.push({id:now.toString(36)+Math.random().toString(36).slice(2,5),word:r.word.trim()||S.add.word.trim(),pos:r.pos,ipa:r.ipa,say:r.say,audio:r.audio||'',meaning:r.meaning.trim(),example:r.example,tip:r.tip,book:S.add.sentence.trim(),page:S.add.page.trim(),bookTitle:S.add.book.trim(),mine:'',added:now,box:0,reviews:0,due:now});
    activity(0);
    var bt0=S.add.book.trim(),au0=S.add.author.trim(),k0=bt0+'|'+au0;
    if(bt0&&S.covers[bt0]===undefined){if(au0)S.info[bt0]={ua:au0,a:au0,c:undefined};if(CANDS[k0]){CANDS[bt0]=CANDS[k0];applyCover(bt0,0);}else if(TMP[k0]!==undefined)S.covers[bt0]=TMP[k0];}
    if(!DEMO){try{localStorage.setItem('mywords.book',S.add.book.trim());}catch(e2){}}
    S.add={word:'',sentence:'',page:'',book:S.add.book.trim(),author:S.add.author,res:null,busy:false,err:'',quick:false};save();fetchCover(S.words[S.words.length-1].bookTitle);toast('Saved to your shelf');S.tab='home';render();$('#view').scrollTop=0;
}
/* ---------- events ---------- */
document.addEventListener('input',function(e){
  var k=e.target.getAttribute&&e.target.getAttribute('data-in');if(!k)return;
  var v=e.target.value;
  if(k==='aw')S.add.word=v;
  else if(k==='as')S.add.sentence=v;
  else if(k==='ap')S.add.page=v;
  else if(k==='aa'){S.add.author=v;scheduleCover();}
  else if(k==='pm'){var pw=S.pr&&byId(S.pr.queue[S.pr.i]);if(pw){pw.mine=v;save();}}
  else if(k==='ab'){S.add.book=v;scheduleCover();}
  else if(k==='obn'||k==='sn'){S.settings.name=v;save();}
  else if(k==='rm'&&S.add.res)S.add.res.meaning=v;
  else if(k==='q'){S.q=v;$('#list').innerHTML=listHtml();}
  else if(k==='bk'){S.bookF=v;$('#list').innerHTML=listHtml();}
  else if(k==='ms'){var w=byId(S.open);if(w){w.mine=v;save();}}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='imp'&&e.target.files&&e.target.files[0]){
    var fr=new FileReader();
    fr.onload=function(){try{
      var d=JSON.parse(fr.result),have={},n=0;
      S.words.forEach(function(w){have[w.word.toLowerCase()]=1;});
      (d.items||[]).forEach(function(w){if(w&&w.word&&!have[String(w.word).toLowerCase()]){S.words.push(w);n++;}});
      if(d.covers)for(var k in d.covers){if(S.covers[k]===undefined)S.covers[k]=d.covers[k];}
      if(d.info)for(var k2 in d.info){if(!S.info[k2])S.info[k2]=d.info[k2];}
      save();toast(n+' word'+(n===1?'':'s')+' restored');render();
    }catch(err){toast('That file could not be read');}};
    fr.readAsText(e.target.files[0]);
  }
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.deferred=e;if(S.tab==='settings')render();});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),p=S.pr;
  if(act==='tab'){S.tab=b.getAttribute('data-t');S.open=null;S.confirmDel=false;if(S.tab==='practice'&&(p.finished||p.i>=p.queue.length))p.started=false;if(S.tab==='words'){S.filter='All';S.bookF='All books';S.q='';}render();$('#view').scrollTop=0;}
  else if(act==='speak')speak(b.getAttribute('data-w'));
  else if(act==='themes'){S.tab='settings';render();}
  else if(act==='skin'||act==='obskin'){setSkin(b.getAttribute('data-s'));render();}
  else if(act==='layout'||act==='oblayout'){setLayout(b.getAttribute('data-s'));render();}
  else if(act==='skipsplash'){S.stage='app';render();}
  else if(act==='obnext'){S.ob=Math.min(4,S.ob+1);if(S.ob===2&&!S.settings.name){}renderOverlay();}
  else if(act==='obback'){S.ob=Math.max(1,S.ob-1);renderOverlay();}
  else if(act==='obgoal'||act==='setgoal'){S.settings.goal=+b.getAttribute('data-v');save();render();}
  else if(act==='setsess'){S.settings.session=+b.getAttribute('data-v');save();render();}
  else if(act==='settext'){S.settings.text=b.getAttribute('data-v');applyText();save();render();}
  else if(act==='obdone'){S.settings.onboarded=true;S.stage='app';S.tab='home';save();render();}
  else if(act==='exportcsv'){exportCsv();}
  else if(act==='exportjson'){download('my-words-backup.json',JSON.stringify({items:S.words,meta:S.meta,covers:S.covers,info:S.info,settings:S.settings}),'application/json');}
  else if(act==='resetask'){S.confirmReset=true;render();}
  else if(act==='resetno'){S.confirmReset=false;render();}
  else if(act==='resetyes'){S.words=[];S.meta={streak:0,last:'',best:0,day:{date:'',count:0}};S.covers={};S.info={};S.confirmReset=false;save();toast('All words deleted');render();}
  else if(act==='installapp'){var d=S.deferred;if(d){d.prompt();S.deferred=null;}}
  else if(act==='lookup')lookup();
  else if(act==='saveword'){saveWord();}
  else if(act==='quicksave'){S.add.quick=true;lookup();}
  else if(act==='open'){S.tab='words';S.open=b.getAttribute('data-id');S.confirmDel=false;render();$('#view').scrollTop=0;}
  else if(act==='back'){S.open=null;S.confirmDel=false;render();}
  else if(act==='filter'){S.filter=b.getAttribute('data-f');render();}
  else if(act==='cat'){S.tab='words';S.open=null;S.filter=b.getAttribute('data-f');S.bookF='All books';S.q='';render();$('#view').scrollTop=0;}
  else if(act==='book'){S.tab='words';S.open=null;S.filter='All';S.bookF=b.getAttribute('data-b');S.q='';render();$('#view').scrollTop=0;}
  else if(act==='gowords'){S.tab='words';S.open=null;S.filter='All';S.bookF='All books';render();$('#view').scrollTop=0;}
  else if(act==='gopractice'){S.tab='practice';if(p.finished||p.i>=p.queue.length)p.started=false;render();$('#view').scrollTop=0;}
  else if(act==='del'){S.confirmDel=true;render();}
  else if(act==='delno'){S.confirmDel=false;render();}
  else if(act==='delyes'){S.words=S.words.filter(function(w){return w.id!==S.open;});S.open=null;S.confirmDel=false;save();toast('Deleted');render();}
  else if(act==='refind'){var bt=b.getAttribute('data-b'),au=($('#bka')||{}).value||'';au=au.trim();S.info[bt]={ua:au,a:au,c:undefined};delete S.covers[bt];delete CANDS[bt];toast('Looking for the cover…');save();fetchCover(bt).then(function(){render();});}
  else if(act==='nextcover'){(async function(){var bt=b.getAttribute('data-b');if(!CANDS[bt]){var l=await olSearch(bt,(S.info[bt]||{}).ua||'');CANDS[bt]=l||[];}var c=CANDS[bt];if(c.length<2){toast('No other covers found');return;}applyCover(bt,((CI[bt]||0)+1)%c.length);render();})();}
  else if(act==='savemine'){toast('Sentence saved');save();}
  else if(act==='goadd'){S.tab='add';render();$('#view').scrollTop=0;}
  else if(act==='show'){p.shown=true;render();}
  else if(act==='again'||act==='got'){
    var w2=byId(p.queue[p.i]);
    if(w2){
      w2.reviews=(w2.reviews||0)+1;
      if(act==='got'){w2.box=Math.min(5,w2.box+1);w2.due=Date.now()+GAPS[w2.box]*DAY;p.good++;}
      else{w2.box=0;w2.due=Date.now()+60000;if(p.queue.indexOf(w2.id,p.i+1)<0)p.queue.push(w2.id);}
      activity(1);save();
    }
    p.i++;p.shown=false;if(p.i>=p.queue.length)p.finished=true;render();
  }
  else if(act==='prall'){startPractice(true);render();}
  else if(act==='prdue'){startPractice(false);render();}
});

var mm=location.search.match(/[?&]skin=(\w+)/),sv='';try{sv=localStorage.getItem('mywords.skin')||'';}catch(e){}
setSkin(mm?mm[1]:(sv||'lavender'),!!mm);
var ml=location.search.match(/[?&]layout=(\w+)/),lv='';try{lv=localStorage.getItem('mywords.layout')||'';}catch(e){}
setLayout(ml?ml[1]:(lv||'covers'),!!ml);
document.addEventListener('error',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('cimg')){if(t.parentNode&&t.parentNode.classList)t.parentNode.classList.remove('has-img');t.remove();}},true);
if(DEMO){demoData();S.settings.name='reader';S.settings.onboarded=true;}else loadLocal();
applyText();
if(!DEMO){if(!S.settings.onboarded){S.stage='onboard';}else{S.stage='splash';setTimeout(function(){if(S.stage==='splash'){S.stage='app';renderOverlay();}},1700);}}
render();
fetchCovers();
if('serviceWorker' in navigator&&!DEMO){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
