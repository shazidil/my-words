name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - icon-*.png
      - .github/workflows/android.yml
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Wrap the web app with Capacitor
        run: |
          mkdir -p "$RUNNER_TEMP/cap/www"
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-180.png "$RUNNER_TEMP/cap/www/"
          cd "$RUNNER_TEMP/cap"
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "My Words" com.shazidil.mywords --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd "$RUNNER_TEMP/cap/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/my-words.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: my-words-apk
          path: my-words.apk
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest my-words.apk --title "My Words (Android app)" --notes "Install: download my-words.apk on your Android phone and open it. Allow installs from this source if asked."
